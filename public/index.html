<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Imagine</title><meta name="theme-color" content="#0b0b0d"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Ccircle cx=%225%22 cy=%225%22 r=%224%22 fill=%22%23ffb347%22/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="dot"></span>Live&nbsp;Imagine</div><div id="status" class="pill">checking…</div></header>
<main>
  <section class="stage">
    <div class="frame" id="frame">
      <canvas id="cv" width="1024" height="1024"></canvas>
      <div class="overlay" id="overlay"><p>Type a prompt and press <b>Generate</b>.<br>You'll watch the image form step by step.</p></div>
      <div class="hud"><span id="hudStep">idle</span><span id="hudTime"></span></div>
    </div>
    <div class="strip" id="strip" aria-label="Intermediate frames"></div>
  </section>
  <section class="panel">
    <form id="f">
      <label>Prompt<textarea id="prompt" rows="4" required placeholder="A lighthouse on a cliff at dusk, volumetric fog, cinematic"></textarea></label>
      <label>Negative prompt <small>(optional)</small><input id="neg" placeholder="blurry, text, watermark"></label>
      <div class="row">
        <label>Aspect<select id="aspect"><option>1:1</option><option>4:3</option><option>3:4</option><option>16:9</option><option>9:16</option></select></label>
        <label>Steps<input id="steps" type="number" min="4" max="50" value="28"></label>
        <label>Seed<input id="seed" type="number" placeholder="random"></label>
      </div>
      <div class="row btns"><button id="go" type="submit">Generate</button><button id="dl" type="button" disabled>Download PNG</button></div>
      <p id="msg" class="msg"></p>
    </form>
    <h2>History</h2><div class="gallery" id="gallery"></div>
    <p class="fine">Frames are real intermediate decodes streamed from FLUX.1 [dev] on fal.ai. Images and history stay in this browser (IndexedDB).</p>
  </section>
</main>
<script src="app.js" type="module"></script></body></html>
